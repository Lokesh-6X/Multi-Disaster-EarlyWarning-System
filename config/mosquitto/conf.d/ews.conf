# Generated by scripts/setup-mosquitto.ps1 (design/01 section 1.3.1, DD11, DD109). Edit the script, not this file.
listener 1883
allow_anonymous false
password_file D:\Major Project\Disaster Predection\config\mosquitto\passwd
acl_file D:\Major Project\Disaster Predection\config\mosquitto\acl
persistence true
persistence_location C:\ProgramData\mosquitto\
